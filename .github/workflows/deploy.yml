name: Test and deploy to Firebase Hosting
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser and Japanese fonts
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-cjk
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run all tests
        run: python tools/run-tests.py
  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DARTS_TRAINING_LAB }}
          projectId: darts-training-lab
          channelId: live

  preview:
    needs: test
    # This branch is for source review only; do not create a Hosting preview.
    if: github.event_name == 'pull_request' && github.head_ref != 'refactor/split-app-modules'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DARTS_TRAINING_LAB }}
          projectId: darts-training-lab
          channelId: pr-${{ github.event.number }}
          expires: 30d
